[workspace]
publish = false
# Determine versions from git tags, not the cargo registry.
git_only = true
# GitHub Release is created by the Release workflow (not release-plz)
# to avoid immutable release conflicts when uploading binaries.
git_release_enable = false
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_update = true
semver_check = false
pr_labels = ["release"]
release_commits = "^(feat|fix|refactor|perf)(\\([^)]+\\))?:"

[[package]]
name = "saragossa"
changelog_path = "CHANGELOG.md"
git_release_name = "v{{ version }}"

# Distribution via tags Git et Homebrew uniquement ; aucune publication crates.io.
# git_only évite de comparer les versions avec un crate absent du registre.
