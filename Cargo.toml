[package]
name = "saragossa"
version = "0.3.0"
description = "Pure-Rust Metal inference engine for Apple Silicon: Qwen dense/MoE LLMs, Whisper STT, Qwen3 TTS, OpenAI-compatible server — GPU-resident decode, 35B MoE at ~105 tok/s."
repository = "https://github.com/azerozero/saragossa"
keywords = ["llm", "inference", "metal", "apple-silicon", "transformer"]
categories = ["science", "concurrency", "command-line-utilities"]
license = "Apache-2.0"
publish = false
edition = "2021"
rust-version = "1.85"
build = "build.rs"
# `tools/` regroupe des utilitaires Python annexes (quantification, mesure de
# qualité) : utiles dans le dépôt, inutiles à qui compile le crate. Les exclure
# garde le paquet source strictement Rust.
# `tests/fixtures/` : corpus de prompts des oracles (textes tiers sous leurs
# propres licences), réservé aux tests du dépôt.
exclude = ["tools/", "tests/fixtures/"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[profile.release]
strip = true

[lib]
name = "saragossa"
path = "src/lib.rs"

[[bin]]
name = "saragossa"
path = "src/main.rs"
required-features = ["devtools"]

[[example]]
name = "mtp_qmm_gate"
required-features = ["metal"]

[[example]]
name = "dump_layers"
required-features = ["devtools"]

[features]
default = ["metal", "devtools"]
metal = ["dep:metal"]
devtools = []

[dependencies]
thiserror = "2"
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
rayon = "1"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
rustfft = "6"
hound = "3.5"
md5 = "0.7"
sha2 = "0.10"
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.29", optional = true }
mach-sys = "0.5"

[dev-dependencies]
proptest = "1"
tempfile = "3"
