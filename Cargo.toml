[package]
name = "saragossa"
version = "0.3.7"
description = "Pure-Rust Metal inference engine for Apple Silicon: Qwen dense/MoE LLMs, Whisper STT, Qwen3 TTS, OpenAI-compatible server — GPU-resident decode, 35B MoE at ~105 tok/s."
repository = "https://github.com/azerozero/saragossa"
keywords = ["llm", "inference", "metal", "apple-silicon", "transformer"]
categories = ["science", "concurrency", "command-line-utilities"]
license = "Apache-2.0"
# release-plz ignore un paquet non publiable : la publication crates.io reste
# coupée par `publish = false` dans release-plz.toml.
publish = true
edition = "2021"
rust-version = "1.85"
build = "build.rs"
# `tools/` regroupe des utilitaires Python annexes (quantification, mesure de
# qualité) : utiles dans le dépôt, inutiles à qui compile le crate. Les exclure
# garde le paquet source strictement Rust.
# `tests/fixtures/` : corpus de prompts des oracles (textes tiers sous leurs
# propres licences), réservé aux tests du dépôt.
exclude = ["tools/", "tests/fixtures/"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[profile.release]
strip = true

[lib]
name = "saragossa"
path = "src/lib.rs"

[[bin]]
name = "saragossa"
path = "src/main.rs"

[[example]]
name = "mtp_qmm_gate"
required-features = ["metal"]

[[example]]
name = "dump_layers"
required-features = ["devtools"]

[[example]]
name = "quant_micro"
required-features = ["metal", "devtools"]

[features]
default = ["metal", "devtools", "stt", "tts", "diar", "vision", "denoise", "embed", "serve", "decision", "ws"]
webtransport = ["serve", "denoise", "dep:tokio", "dep:http", "dep:quinn", "dep:rustls", "dep:rcgen", "dep:web-transport-quinn", "dep:url", "dep:x509-parser"]
h2 = ["serve", "denoise", "dep:h2", "dep:tokio", "dep:bytes", "dep:http"]
ws = ["serve", "denoise", "dep:sha1_smol", "dep:base64"]
stt = ["dep:flate2", "dep:rustfft", "dep:hound"]
tts = ["dep:rustfft", "dep:hound"]
diar = ["dep:rustfft", "dep:hound"]
vision = []
denoise = ["dep:rustfft", "dep:hound"]
embed = []
serve = []
decision = []
metal = ["dep:metal"]
devtools = []

[dependencies]
thiserror = "2"
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
# Déjà présent via reqwest : `compression_ratio` Whisper (zlib, comme OpenAI).
flate2 = { version = "1", optional = true }
# preserve_order : ordre des questions de `decision` (déjà activé par llguidance).
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
rayon = "1"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
rustfft = { version = "6", optional = true }
hound = { version = "3.5", optional = true }
md5 = "0.8"
sha2 = "0.11"
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }
fs2 = "0.4"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"], optional = true }
web-transport-quinn = { version = "0.13.6", default-features = false, features = ["ring"], optional = true }
x509-parser = { version = "0.18", default-features = false, optional = true }
url = { version = "2", optional = true }
h2 = { version = "0.4", optional = true }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"], optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
sha1_smol = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }

# Last llguidance line compatible with Rust 1.85; keep toktrie aligned.
[dependencies.llguidance]
version = "=1.2.0"
default-features = false

[dependencies.toktrie]
version = "=1.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33", optional = true }
mach-sys = "0.5"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[[example]]
name = "bench_stt"
required-features = ["stt"]

[[example]]
name = "decision_bench"
required-features = ["decision"]

[[example]]
name = "decision_tta_bench"
required-features = ["decision"]

[[example]]
name = "letters_bench"
required-features = ["decision"]
